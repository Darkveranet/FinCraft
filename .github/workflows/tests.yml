name: Tests

# Run the FinCraft test suite automatically.
on:
  push:
    branches: ['**']          # every branch push
  pull_request:
    branches: ['**']          # and every PR
  workflow_dispatch: {}        # plus a manual "Run workflow" button

# Cancel an in-progress run if the same ref is pushed again.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']   # LTS + current

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Uses package-lock.json for a reproducible install; installs jsdom so the
      # DOM-based suites (module-integrity, business-logic) actually run instead
      # of skipping.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  demo-e2e:
    name: Playwright - live Fineract demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The public demo is shared and periodically reset. Keep runs serialized so
    # this repository does not create avoidable load or race with itself.
    concurrency:
      group: fincraft-fineract-demo-e2e
      cancel-in-progress: false
    env:
      FINERACT_URL: ${{ secrets.FINERACT_URL || 'https://apis.mifos.community' }}
      FINERACT_TENANT: ${{ secrets.FINERACT_TENANT || 'default' }}
      FINERACT_USER: ${{ secrets.FINERACT_USER || 'mifos' }}
      FINERACT_PASS: ${{ secrets.FINERACT_PASS || 'password' }}
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      # Resolve the public demo before downloading the browser. The Mifos
      # community demo hostname can change, while self-hosted users normally
      # provide FINERACT_URL as a repository secret.
      - name: Resolve and verify live Fineract API
        shell: bash
        run: |
          set -euo pipefail
          auth="Basic $(printf '%s' "$FINERACT_USER:$FINERACT_PASS" | base64 -w0)"
          configured="${FINERACT_URL%/}"
          candidates=(
            "$configured"
            "https://demo.mifos.io"
            "https://fineract-vm.apache.org"
          )

          : > /tmp/fineract-probe.log
          resolved=""
          for host in "${candidates[@]}"; do
            # Skip duplicate fallback values.
            grep -Fxq "$host" /tmp/fineract-hosts-seen 2>/dev/null && continue
            echo "$host" >> /tmp/fineract-hosts-seen
            endpoint="$host/fineract-provider/api/v1/offices"
            code=$(curl --location --silent --show-error \
              --connect-timeout 15 --max-time 45 \
              -H "Fineract-Platform-TenantId: $FINERACT_TENANT" \
              -H "Authorization: $auth" \
              -H "Accept: application/json" \
              -o /tmp/fineract-offices.json \
              -w '%{http_code}' "$endpoint" || true)
            printf '%s -> HTTP %s\n' "$endpoint" "$code" | tee -a /tmp/fineract-probe.log
            if [[ "$code" =~ ^2 ]] && node -e               "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/fineract-offices.json','utf8')); if(!Array.isArray(x)) process.exit(1)"; then
              resolved="$host"
              break
            fi
          done

          if [ -z "$resolved" ]; then
            echo '::error::No compatible live Fineract API was reachable with the configured credentials.'
            echo 'Set FINERACT_URL, FINERACT_TENANT, FINERACT_USER, and FINERACT_PASS repository secrets to a writable test tenant.'
            cat /tmp/fineract-probe.log
            exit 1
          fi

          echo "FINERACT_URL=$resolved" >> "$GITHUB_ENV"
          echo "Resolved Fineract API host: $resolved"

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Run authenticated read-only E2E suite
        run: npx playwright test tests-e2e/smoke.spec.mjs tests-e2e/demo-e2e.spec.mjs

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fincraft-fineract-demo-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
