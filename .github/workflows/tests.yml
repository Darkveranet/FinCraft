name: Tests

# Run the FinCraft test suite automatically.
on:
  push:
    branches: ['**']          # every branch push
  pull_request:
    branches: ['**']          # and every PR
  workflow_dispatch: {}        # plus a manual "Run workflow" button

# Cancel an in-progress run if the same ref is pushed again.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']   # LTS + current

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Uses package-lock.json for a reproducible install; installs jsdom so the
      # DOM-based suites (module-integrity, business-logic) actually run instead
      # of skipping.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  container-e2e:
    name: Playwright - deployed container system
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every push/PR runs the authenticated E2E suite against a self-contained,
    # disposable Postgres + Fineract stack (the deployed container system),
    # NOT the shared public demo — so runs are hermetic, writable and
    # reproducible. Serialize per-ref so concurrent runs don't fight over the
    # fixed host ports (5432/8443) on the runner.
    concurrency:
      group: fincraft-container-e2e-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Point every Fineract-touching spec at the local container stack.
      FINERACT_URL: https://127.0.0.1:8443
      FINERACT_TENANT: default
      FINERACT_USER: mifos
      FINERACT_PASS: password
      # Pin the image here so it's the single knob for the whole suite.
      FINERACT_IMAGE: apache/fineract:latest
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      # Boot the SAME deployed container system used by the isolated suite and
      # the API-automation pipeline (single source of truth).
      - name: Boot deployed container system (Postgres + Fineract)
        run: bash scripts/e2e/stack-up.sh

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Run authenticated E2E suite against the container stack
        run: npx playwright test tests-e2e/smoke.spec.mjs tests-e2e/demo-e2e.spec.mjs

      - name: Tear down deployed container system
        if: always()
        run: bash scripts/e2e/stack-down.sh fineract-container-e2e.log

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fincraft-container-e2e-playwright
          path: |
            playwright-report/
            test-results/
            fineract-container-e2e.log
          if-no-files-found: ignore
          retention-days: 14
