name: Isolated Fineract Transactional E2E

on:
  workflow_dispatch:
    inputs:
      fineract_image:
        description: Fineract Docker image for the deployed container system
        required: true
        default: apache/fineract:latest
      suite:
        description: Playwright suite to execute
        required: true
        type: choice
        default: full
        options: [client, accounting, products, clients, groups-centers, savings, loans, fixed-deposits, recurring-deposits, accounting-advanced, fixed-deposits-extended, recurring-deposits-extended, taxation, reporting, accounting-completion, security, notifications, shares, savings-extended, loans-extended, settings, full]
  schedule:
    - cron: '20 1 * * *'

permissions:
  contents: read

concurrency:
  group: isolated-fineract-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  FINERACT_URL: https://127.0.0.1:8443
  FINERACT_TENANT: default
  FINERACT_USER: mifos
  FINERACT_PASS: password
  E2E_TARGET: isolated-ci
  ALLOW_TRANSACTIONAL_E2E: 'true'
  FINERACT_IMAGE: ${{ inputs.fineract_image || 'apache/fineract:latest' }}

jobs:
  transactional-e2e:
    name: Disposable Fineract + FinCraft Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout FinCraft
        uses: actions/checkout@v7

      - name: Guard against shared or production target
        run: node scripts/e2e/guard-target.mjs

      # Boot the SAME deployed container system (Postgres + Fineract) used by
      # tests.yml and the API-automation pipeline — no cloning apache/fineract,
      # no second compose file. stack-up.sh also waits for actuator health.
      - name: Boot deployed container system (Postgres + Fineract)
        run: bash scripts/e2e/stack-up.sh

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install FinCraft and Playwright
        run: |
          npm ci
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Generate complete FinCraft function inventory
        run: node scripts/e2e/function-inventory.mjs

      - name: Run client lifecycle gate
        if: ${{ inputs.suite == 'client' }}
        run: npx playwright test tests-e2e/isolated/01-client-lifecycle.spec.mjs

      - name: Run accounting lifecycle module
        if: ${{ inputs.suite == 'accounting' }}
        run: npx playwright test tests-e2e/isolated/04-accounting-setup.spec.mjs

      - name: Run product lifecycle module
        if: ${{ inputs.suite == 'products' }}
        run: npx playwright test tests-e2e/isolated/05-product-setup.spec.mjs

      - name: Run clients lifecycle module
        if: ${{ inputs.suite == 'clients' }}
        run: npx playwright test tests-e2e/isolated/06-client-lifecycle.spec.mjs

      - name: Run groups and centres lifecycle module
        if: ${{ inputs.suite == 'groups-centers' }}
        run: npx playwright test tests-e2e/isolated/07-groups-centers-lifecycle.spec.mjs

      - name: Run savings lifecycle module
        if: ${{ inputs.suite == 'savings' }}
        run: npx playwright test tests-e2e/isolated/08-savings-lifecycle.spec.mjs

      - name: Run loans lifecycle module
        if: ${{ inputs.suite == 'loans' }}
        run: npx playwright test tests-e2e/isolated/09-loans-lifecycle.spec.mjs

      - name: Run fixed deposits lifecycle module
        if: ${{ inputs.suite == 'fixed-deposits' }}
        run: npx playwright test tests-e2e/isolated/10-fixed-deposits-lifecycle.spec.mjs

      - name: Run recurring deposits lifecycle module
        if: ${{ inputs.suite == 'recurring-deposits' }}
        run: npx playwright test tests-e2e/isolated/11-recurring-deposits-lifecycle.spec.mjs

      - name: Run advanced accounting lifecycle module
        if: ${{ inputs.suite == 'accounting-advanced' }}
        run: npx playwright test tests-e2e/isolated/12-accounting-advanced-lifecycle.spec.mjs

      - name: Run fixed deposits extended lifecycle module
        if: ${{ inputs.suite == 'fixed-deposits-extended' }}
        run: npx playwright test tests-e2e/isolated/13-fixed-deposits-extended.spec.mjs

      - name: Run recurring deposits extended lifecycle module
        if: ${{ inputs.suite == 'recurring-deposits-extended' }}
        run: npx playwright test tests-e2e/isolated/14-recurring-deposits-extended.spec.mjs

      - name: Run taxation lifecycle module
        if: ${{ inputs.suite == 'taxation' }}
        run: npx playwright test tests-e2e/isolated/15-taxation-lifecycle.spec.mjs

      - name: Run reporting lifecycle module
        if: ${{ inputs.suite == 'reporting' }}
        run: npx playwright test tests-e2e/isolated/16-reporting-lifecycle.spec.mjs

      - name: Run accounting completion lifecycle module
        if: ${{ inputs.suite == 'accounting-completion' }}
        run: npx playwright test tests-e2e/isolated/17-accounting-completion.spec.mjs

      - name: Run security lifecycle module
        if: ${{ inputs.suite == 'security' }}
        run: npx playwright test tests-e2e/isolated/18-security-lifecycle.spec.mjs

      - name: Run notifications lifecycle module
        if: ${{ inputs.suite == 'notifications' }}
        run: npx playwright test tests-e2e/isolated/19-notifications-lifecycle.spec.mjs

      - name: Run shares lifecycle module
        if: ${{ inputs.suite == 'shares' }}
        run: npx playwright test tests-e2e/isolated/20-shares-lifecycle.spec.mjs

      - name: Run savings extended lifecycle module
        if: ${{ inputs.suite == 'savings-extended' }}
        run: npx playwright test tests-e2e/isolated/21-savings-extended.spec.mjs

      - name: Run loans extended lifecycle module
        if: ${{ inputs.suite == 'loans-extended' }}
        run: npx playwright test tests-e2e/isolated/22-loans-extended.spec.mjs

      - name: Run settings lifecycle module
        if: ${{ inputs.suite == 'settings' }}
        run: npx playwright test tests-e2e/isolated/23-settings-lifecycle.spec.mjs

      - name: Run full isolated suite
        if: ${{ inputs.suite != 'client' && inputs.suite != 'accounting' && inputs.suite != 'products' && inputs.suite != 'clients' && inputs.suite != 'groups-centers' && inputs.suite != 'savings' && inputs.suite != 'loans' && inputs.suite != 'fixed-deposits' && inputs.suite != 'recurring-deposits' && inputs.suite != 'accounting-advanced' && inputs.suite != 'fixed-deposits-extended' && inputs.suite != 'recurring-deposits-extended' && inputs.suite != 'taxation' && inputs.suite != 'reporting' && inputs.suite != 'accounting-completion' && inputs.suite != 'security' && inputs.suite != 'notifications' && inputs.suite != 'shares' && inputs.suite != 'savings-extended' && inputs.suite != 'loans-extended' && inputs.suite != 'settings' }}
        run: npx playwright test tests-e2e/isolated

      - name: Upload end-to-end evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: isolated-fineract-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            fineract-containers.log
            tests-e2e/coverage-manifest.json
            test-results/function-inventory.json
            test-results/function-inventory.md
          if-no-files-found: warn
          retention-days: 30

      # Exports container logs to fineract-containers.log, then destroys the
      # deployed container system (and its volume). Same helper as tests.yml.
      - name: Tear down deployed container system
        if: always()
        run: bash scripts/e2e/stack-down.sh fineract-containers.log
