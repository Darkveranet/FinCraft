# ─────────────────────────────────────────────────────────────────────────────
# FinCraft · Dependabot (§4 of the developer-recommendations report)
#
# Lightweight and appropriate given the project's tiny dependency surface
# (jsdom, acorn, acorn-walk + whatever tooling like eslint/prettier gets added).
# Weekly cadence keeps noise low; GitHub Actions are watched too so the CI
# workflows stay on current action versions.
# ─────────────────────────────────────────────────────────────────────────────
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "eslint*"
          - "prettier*"
          - "@playwright/*"
          - "playwright*"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
