# tools/api-automation/docker-compose.fineract.yml
#
# Disposable, self-contained Postgres + Fineract stack used to fetch the
# OpenAPI spec from a *live, running* Fineract (fetch-spec.mjs priority #2:
# FINERACT_BASE_URL) instead of `docker cp`-ing the static file out of the
# image (priority #3).
#
# This is intentionally ephemeral: no TLS cert volume, no nginx UI, no data
# persistence. It boots, serves its own self-signed HTTPS on :8443, the
# pipeline reads /fineract-provider/swagger-ui/fineract.json off it, then the
# whole stack (and its volume) is torn down.
#
#   docker compose -f docker-compose.fineract.yml up -d
#   ./wait-fineract.sh
#   FINERACT_BASE_URL=https://127.0.0.1:8443 NODE_TLS_REJECT_UNAUTHORIZED=0 \
#     node run.mjs
#   docker compose -f docker-compose.fineract.yml down --volumes
#
# The one-shot `./live-run.sh` orchestrates all of the above for you.

name: fincraft-api-automation

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: fincraft-api-db
    # A throwaway CI/dev DB — tuned small, not for production.
    mem_limit: 1g
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=60"
      - "-c"
      - "fsync=off"                # ephemeral: trade durability for boot speed
      - "-c"
      - "synchronous_commit=off"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: fineract_tenants
      # Consumed by ../../deploy/init-db/01-init-fineract.sh to create the
      # fineract_app role and the default tenant database.
      FINERACT_DB_PASSWORD: ${FINERACT_DB_PASSWORD:-fineract}
      DEFAULT_TENANT_DB_NAME: ${DEFAULT_TENANT_DB_NAME:-fineract_default}
      TZ: UTC
    volumes:
      # Single source of truth — reuse the same init script production uses.
      - ../../deploy/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    networks:
      - fineract-net

  fineract:
    image: ${FINERACT_IMAGE:-apache/fineract:latest}
    container_name: fincraft-api-fineract
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 6g
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: "-Xms1g -Xmx4g"
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://db:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: fineract_app
      FINERACT_HIKARI_PASSWORD: ${FINERACT_DB_PASSWORD:-fineract}
      FINERACT_HIKARI_MINIMUM_IDLE: 3
      FINERACT_HIKARI_MAXIMUM_POOL_SIZE: 10
      FINERACT_HIKARI_IDLE_TIMEOUT: 60000
      FINERACT_HIKARI_CONNECTION_TIMEOUT: 20000
      FINERACT_HIKARI_TEST_QUERY: "SELECT 1"
      FINERACT_HIKARI_AUTO_COMMIT: "true"
      FINERACT_SERVER_SSL_ENABLED: "true"
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: db
      FINERACT_DEFAULT_TENANTDB_PORT: 5432
      FINERACT_DEFAULT_TENANTDB_UID: fineract_app
      FINERACT_DEFAULT_TENANTDB_PWD: ${FINERACT_DB_PASSWORD:-fineract}
      FINERACT_DEFAULT_TENANTDB_NAME: ${DEFAULT_TENANT_DB_NAME:-fineract_default}
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: ${DEFAULT_TENANT_IDENTIFIER:-default}
      FINERACT_DEFAULT_TENANTDB_CONN_PARAMS: ""
    ports:
      - "127.0.0.1:8443:8443"
    healthcheck:
      # Fineract's Spring Boot actuator health endpoint. On a cold, first boot
      # it runs the full Liquibase migration before binding :8443, so the
      # start_period is generous; subsequent runs on a warm image are quick.
      test: ["CMD-SHELL", "curl -kfsS https://127.0.0.1:8443/fineract-provider/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 240s
    networks:
      - fineract-net

networks:
  fineract-net:
    driver: bridge
